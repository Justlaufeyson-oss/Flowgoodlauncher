name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip
        run: |
          unzip -o *.zip
          # Agar zip ke andar ek aur sub-folder ho, toh files bahar lane ke liye:
          find . -name "gradlew" -exec cp -r {} . \; 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
